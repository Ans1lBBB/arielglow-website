name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build static pages
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create arielglow-website --production-branch=main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=arielglow-website --branch=main --commit-dirty=true

      - name: Bind custom domains
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for domain in www.arielglow.com arielglow.com; do
            echo "Adding domain: ${domain}"
            response=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/arielglow-website/domains" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${domain}\"}")
            echo "$response"
            if echo "$response" | grep -q '"success":true'; then
              echo "OK: ${domain}"
            elif echo "$response" | grep -qi "already exists\|duplicate"; then
              echo "Already bound: ${domain}"
            else
              echo "Warning: could not add ${domain} (may need manual DNS in Cloudflare Dashboard)"
            fi
          done
        continue-on-error: true
