name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build static pages
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create arielglow-website --production-branch=main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=arielglow-website --branch=main --commit-dirty=true

      - name: Bind custom domains
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for domain in www.arielglow.com arielglow.com; do
            echo "Adding domain: ${domain}"
            response=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/arielglow-website/domains" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${domain}\"}")
            echo "$response"
            if echo "$response" | grep -q '"success"[[:space:]]*:[[:space:]]*true'; then
              echo "OK: ${domain}"
            elif echo "$response" | grep -qiE "already exists|duplicate|already added|8000018"; then
              echo "Already bound: ${domain}"
            else
              echo "Warning: could not add ${domain}"
            fi
          done
        continue-on-error: true

      - name: Ensure DNS records for Pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ["CF_TOKEN"]
          target = "arielglow-website.pages.dev"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def api(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  return json.loads(e.read().decode())

          zones = api("GET", "https://api.cloudflare.com/client/v4/zones?name=arielglow.com")
          if not zones.get("result"):
              print("Zone not found or token lacks Zone:Read")
              raise SystemExit(0)
          zone_id = zones["result"][0]["id"]
          print(f"Zone ID: {zone_id}")

          records = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?per_page=100")
          if not records.get("success"):
              print(f"DNS list failed (token may need Zone DNS Edit): {records.get('errors')}")
              raise SystemExit(0)
          existing = records.get("result") or []

          def upsert_cname(name, content):
              fqdn = name if name.endswith("arielglow.com") else f"{name}.arielglow.com"
              if name == "@":
                  fqdn = "arielglow.com"
              for rec in existing:
                  if rec["name"] == fqdn and rec["type"] == "CNAME" and rec["content"] == content:
                      print(f"CNAME OK: {fqdn} -> {content}")
                      return
              for rec in existing:
                  if rec["name"] == fqdn and rec["type"] in ("A", "AAAA", "CNAME"):
                      print(f"Deleting {rec['type']} {fqdn} (was {rec['content']})")
                      api("DELETE", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{rec['id']}")
              payload = {"type": "CNAME", "name": name, "content": content, "proxied": True, "ttl": 1}
              res = api("POST", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records", payload)
              if res.get("success"):
                  print(f"Created CNAME {fqdn} -> {content}")
              else:
                  print(f"Failed CNAME {fqdn}: {res.get('errors')}")

          upsert_cname("www", target)
          upsert_cname("@", target)
          PY
        continue-on-error: true

      - name: Apex redirect arielglow.com to www
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ["CF_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def api(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode())
              except urllib.error.HTTPError as e:
                  return json.loads(e.read().decode())

          zones = api("GET", "https://api.cloudflare.com/client/v4/zones?name=arielglow.com")
          if not zones.get("result"):
              print("Zone not found")
              raise SystemExit(0)
          zone_id = zones["result"][0]["id"]
          phase = "http_request_dynamic_redirect"
          entry = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/phases/{phase}/entrypoint")
          rule = {
              "expression": '(http.host eq "arielglow.com")',
              "description": "Redirect apex to www",
              "action": "redirect",
              "action_parameters": {
                  "from_value": {
                      "status_code": 301,
                      "target_url": {
                          "expression": 'concat("https://www.arielglow.com", http.request.uri.path)'
                      },
                      "preserve_query_string": True
                  }
              }
          }
          if entry.get("result"):
              rs = entry["result"]
              rules = [r for r in rs.get("rules", []) if r.get("description") != "Redirect apex to www"]
              rules.insert(0, rule)
              res = api("PUT", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/{rs['id']}", {
                  "rules": rules
              })
          else:
              res = api("PUT", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/phases/{phase}/entrypoint", {
                  "rules": [rule]
              })
          if res.get("success"):
              print("Apex redirect rule OK")
          else:
              print(f"Apex redirect failed (token may need Zone Rules Edit): {res.get('errors')}")
          PY
        continue-on-error: true
