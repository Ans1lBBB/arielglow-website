name: Cloudflare hardening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ensure-cloudflare.py"
      - ".github/workflows/cloudflare-hardening.yml"

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply DNS, SSL, DMARC, Pages domains, redirects
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/ensure-cloudflare.py
